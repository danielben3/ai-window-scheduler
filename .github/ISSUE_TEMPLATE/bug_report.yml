name: Bug report
description: Report a reproducible scheduler problem
body:
  - type: markdown
    attributes:
      value: Do not include credentials, conversation IDs, private prompts, or unredacted logs.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, provider CLI versions, and scheduler release.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include whether this is a version check, daily request, or continuation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
